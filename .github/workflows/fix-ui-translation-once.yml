name: Fix UI translation once

on:
  push:
    paths:
      - '.github/workflows/fix-ui-translation-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing translations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          updates = {
              Path('ui/texts/ger/strings'): ('label_photos_person_id="Photos Person-ID:"', 'label_photos_person="Photos-Person:"'),
              Path('ui/texts/enu/strings'): ('label_photos_person_id="Photos Person ID:"', 'label_photos_person="Photos person:"'),
          }

          for path, (anchor, new_line) in updates.items():
              text = path.read_text()
              if new_line in text:
                  continue
              if anchor not in text:
                  raise SystemExit(f'Anchor not found in {path}: {anchor}')
              text = text.replace(anchor, new_line + '\n' + anchor, 1)
              path.write_text(text)
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/texts/ger/strings ui/texts/enu/strings
          git commit -m "Fix missing UI translation key"
          git push
